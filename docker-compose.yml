services:
  server:
    build:
      context: ./server
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      PORT: 3001
      BASE_URL: http://localhost:3001
      CLIENT_URL: http://localhost:5173

  frontend:
    build:
      context: .
      args:
        VITE_BASE_URL: http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      - server
